name: Deploy Viri Web to VPS

on:
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
    defaults:
      run:
        working-directory: ./viri-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build wasm playground
        working-directory: ./
        run: |
          GOOS=js GOARCH=wasm go build -o viri-web/public/viri.wasm ./cmd/web-playground/
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" viri-web/public/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./viri-web/package-lock.json

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            viri-web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('viri-web/package-lock.json') }}-${{ hashFiles('viri-web/**.[jt]s', 'viri-web/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('viri-web/package-lock.json') }}-

      # This project uses npm; viri-web/package-lock.json is the lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npx --no-install next build

      - name: Convert OG image to PNG
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1200 -h 630 out/og-image.svg -o out/og-image.png

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # --delete removes files from old builds so stale pages don't linger
      - name: Upload build
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            out/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

name: Deploy Viri Web to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
    defaults:
      run:
        working-directory: ./viri-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build wasm playground
        working-directory: ./
        run: |
          GOOS=js GOARCH=wasm go build -o viri-web/public/viri.wasm ./cmd/web-playground/
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" viri-web/public/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./viri-web/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
          generator_config_file: ./viri-web/next.config.ts

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            viri-web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('viri-web/package-lock.json') }}-${{ hashFiles('viri-web/**.[jt]s', 'viri-web/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('viri-web/package-lock.json') }}-

      # This project uses npm; viri-web/package-lock.json is the lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npx --no-install next build

      - name: Convert OG image to PNG
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1200 -h 630 out/og-image.svg -o out/og-image.png

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./viri-web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
